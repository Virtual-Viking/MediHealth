apiVersion: 1
datasources:
  - name: GCP Cloud Monitoring
    type: stackdriver
    access: proxy
    isDefault: false
    editable: true
    jsonData:
      authenticationType: gce  # Uses GOOGLE_APPLICATION_CREDENTIALS
      defaultProject: "ethereal-effort-475219-c2"
      # Optional: set a location to scope queries
      # defaultLocation: "global"
      # Optional: set a default service (for Cloud Run/GAE)
      # defaultService: ""
      # Optional: custom namespaces for custom metrics
      # customMetricsNamespaces: []

