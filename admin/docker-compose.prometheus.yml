version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: medilink-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: medilink-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/:/host:ro,rslave"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: medilink-postgres-exporter
    environment:
      # Point this to your Cloud SQL Postgres instance; ensure the source IP is authorized or use a Cloud SQL Proxy.
      DATA_SOURCE_NAME: ${DATA_SOURCE_NAME:-postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable}
    ports:
      - "9187:9187"
    restart: unless-stopped

